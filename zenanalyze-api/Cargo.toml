[package]
name = "zenanalyze-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/imazen/zenanalyze"
description = "Version-unifying feature contract for the zenanalyze picker tree: Request (what a codec wants) + Offer (a self-describing feature result) so a dozen codecs on different zenanalyze/zenpredict versions can share one extraction pass. Pure transport — no feature definitions."
keywords = ["image", "features", "codec", "picker", "contract"]
categories = ["multimedia::images", "no-std"]

# IMPORTANT: this crate is the UNIFYING contract. Many zenanalyze versions
# coexist in one build; THIS crate is the single type every layer agrees on, so
# it MUST stay API-stable — a breaking change splits the ecosystem. It carries
# only transport types (names, values, a reuse key), never feature definitions,
# which is what lets it freeze. No dependencies (core + alloc only) so nothing it
# pulls in can force a version split either.
#
# VERSION POLICY: the surface is still settling, so the crate is at 0.1.x — a
# single-version in-house contract for now (Cargo doesn't unify 0.1 with 0.2).
# Once it stabilizes it FREEZES at 1.0 and evolves ONLY additively (new pub items,
# new fields on #[non_exhaustive] types); it must NEVER go to 2.0 — from 1.0 on
# Cargo unifies every 1.x, so a dozen zenanalyze versions can share one contract
# type, which a 2.0 (or staying on 0.x) would split. The shape is already built
# for that freeze (private fields + #[non_exhaustive]); reaching 1.0 is a version
# bump, not a redesign.

[dependencies]

[lints.rust]
unsafe_code = "forbid"
