[package]
name = "zenanalyze-api"
version = "1.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/imazen/zenanalyze"
description = "Frozen, version-unifying feature contract for the zenanalyze picker tree: Request (what a codec wants) + Offer (a self-describing feature result) so a dozen codecs on different zenanalyze/zenpredict versions can share one extraction pass. Pure transport — no feature definitions."
keywords = ["image", "features", "codec", "picker", "contract"]
categories = ["multimedia::images", "no-std"]

# IMPORTANT: this crate is the UNIFYING contract. Many zenanalyze versions
# coexist in one build; THIS crate is the single type every layer agrees on, so
# it MUST stay API-stable — a breaking change splits the ecosystem. It carries
# only transport types (names, values, a reuse key), never feature definitions,
# which is what lets it freeze. No dependencies (core + alloc only) so nothing it
# pulls in can force a version split either.
#
# VERSION POLICY: this crate is 1.0 and evolves ONLY additively (new pub items,
# new fields on the #[non_exhaustive] Request/Offer). It must NEVER go to 2.0 —
# Cargo only unifies semver-compatible versions, so a 2.0 would split the linked
# ecosystem into two incompatible contract types. A 0.x line would be worse
# still (0.1 and 0.2 don't even unify). Hence 1.0, frozen-but-extensible.

[dependencies]

[lints.rust]
unsafe_code = "forbid"
