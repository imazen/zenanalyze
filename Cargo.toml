[lints.rust]
# zenanalyze ships zero `unsafe` blocks; SIMD goes through the
# safe-token wrappers in archmage / magetypes. Forbidding here
# keeps the door shut against well-meaning PRs that want to drop
# raw `_mm_*` / `vld*` intrinsics into hot loops (see closed #17
# for the recent example). If a future kernel genuinely needs an
# intrinsic that magetypes hasn't wrapped yet, the right play is
# to upstream the wrapper, not relax this lint.
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("avx512", "optimized-tables"))',
] }

[lints.clippy]
all = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# New in clippy 1.98 (2026-08); fires at ~65 `chunks_exact(3|24|…)` pixel loops
# across tier1/tier3/palette/row_stream/tier_depth + tests. `as_chunks` hands
# LLVM fixed-size arrays (bounds-check elimination), so the migration is a REAL
# optimization candidate that must land as its own measured change (cargo asm +
# zenbench + the golden tripwire), not as a lint-silencing sweep. Same
# resolution as zenwebp (#76) and zenjxl-decoder.
chunks_exact_to_as_chunks = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
debug = true

# Even debug / `cargo test` builds run optimization. The crate has
# pixel-loop SIMD kernels that take 30-100x longer at opt-level=0,
# which makes the unit-test suite slow enough that timing-based
# tripwires (the "stride sampling didn't break" perf assertion) fire
# spuriously on weaker runners. opt-level=2 keeps debug info but
# enables the same SIMD codegen as release.
[profile.dev]
opt-level = 2
debug = true

[workspace]
members = ["zenanalyze-api", "zenpicker", "zenpredict", "zenpredict-bake", "zenpredict-viz"]
# zenpicker-train is a local training binary that pulls a cross-repo
# path dependency (`zenstats` from the sibling `zenmetrics` checkout)
# plus parquet/arrow. It is not publishable and the sibling repo is
# not present on CI, so excluding it keeps the workspace manifest
# loadable in CI. Build it on demand with
# `cargo build --manifest-path zenpicker-train/Cargo.toml`.
# `apidoc/` is the CI-free public-API snapshot runner: excluded so plain
# `cargo test` and every CI job never compile its dependency tree or run
# rustdoc. Regenerate via `just api-doc`.
exclude = ["zenpicker-train", "apidoc"]
resolver = "3"

[[bench]]
name = "tier_isolation"
harness = false

[[bench]]
name = "tier_kernels"
harness = false

[[bench]]
name = "budget_cost"
harness = false

[[example]]
name = "budget_decision_ab"
required-features = ["api"]
