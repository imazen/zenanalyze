[package]
name = "zenanalyze"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
repository = "https://github.com/imazen/zenanalyze"
description = "Image content analyzers (variance, edges, chroma sharpness, DCT energy, derived likelihoods) for adaptive codec decisions. Pulls rows on demand from any zenpixels PixelSlice."
keywords = ["image", "analysis", "features", "codec", "saliency"]
categories = ["multimedia::images"]
authors = ["Lilith River <lilith@imazen.io>"]
rust-version = "1.93"
readme = "README.crates.md"
exclude = [
  # Dev tooling / CI — not useful to crates.io consumers
  ".github/**",
  ".gitignore",
  ".claude/**",
  # Dev-only documentation and session notes
  "CLAUDE.md",
  "CONTEXT-HANDOFF.md",
  "everything.md",
  "recovery_cycle_summary_2026-05-13.md",
  "zensim_champion_log.md",
  # Internal planning docs (external users don't need migration plans)
  "MIGRATION_PLAN.md",
  # Research/training artifacts — not part of the Rust library
  "benchmarks/**",
  "docs/**",
  "scripts/**",
  "tools/**",
  "zentrain/**",
]

[lib]
name = "zenanalyze"

[features]
# `experimental` is ON by default (see its note below). Gating useful features
# OFF silently shrank `FeatureSet::SUPPORTED`, dropped the XYB chroma-loss pair
# from picker training sets, and crippled 420-vs-444 discrimination. Default-on
# stops that class of silent-feature-loss disaster from recurring; opt back out
# with `default-features = false` only to pin an older schema.
default = ["experimental"]
# Experimental: extract at FULL sampling budget (pixel_budget = usize::MAX,
# hf_max_blocks = 4096) instead of DEFAULT_PIXEL_BUDGET = 500_000 stride sampling.
# Changes feature VALUES (not the schema) — an experimental extraction variant to
# eval whether full-budget chroma sharpens subsampling discrimination for the
# multi-cell pickers (medium >500k px is the only stride-sampled size + worst at
# sub). A model trained on full-budget features must be served them at inference.
# Off by default; the public budget stays a crate invariant.
full-budgets = []
# Opt into the `zenanalyze-api` producer surface: `OwnedOffer::extract` runs one
# analysis pass and lends a `zenanalyze_api::Offer` (the frozen, version-unifying
# feature contract) so a dozen codecs on different zenanalyze versions can share
# one extraction. Off by default — only picker / orchestrator consumers need it.
# Making it default later is additive; the reverse would be breaking, so it
# starts opt-in.
api = ["dep:zenanalyze-api"]
# Features whose *structural definition* (not just numeric scale) is not
# yet fully settled. **ON BY DEFAULT as of 2026-06-29** — keeping them off
# silently shrank `FeatureSet::SUPPORTED`, so picker re-extractions dropped
# the XYB color-loss pair `xyb444_color_loss` / `xyb_bquarter_chroma_loss`
# (ids 138/139) — the *direct* chroma-subsampling-cost signal — and the
# webp/avif pickers couldn't discriminate 420-vs-444 (off-frontier RD tail).
# Default-on means a useful feature can never be silently extracted-out again.
# Also gates `palette_density` (id 12, `#[deprecated]`, being retired). The
# definitions may still be rebaked; numeric drift stays governed by the
# crate-level threshold contract. `default-features = false` opts out only if
# you must pin an older schema.
experimental = []
# Opt-in to HDR / wide-gamut / depth features (10 features, ids
# 32–39, 46, 47). Off by default — every default sweep corpus is
# SDR-only so the analyzer hot path skips the source-direct depth
# tier entirely. Codecs that handle PQ / HLG / 10-bit / wide-gamut
# content opt in. See `tier_depth` for the implementation.
hdr = []

[dependencies]
# The frozen, version-unifying feature contract (Request/Offer). Optional (gated
# by the `api` feature), 1.0 and zero-dep so every zenanalyze version depends on
# the SAME zenanalyze-api and their Offers unify across a multi-version build.
# Publish zenanalyze-api before zenanalyze when releasing with `api` enabled.
#
# The requirement is `0.1.1`, not `0.1.0`, and that is load-bearing: `src/offer.rs`
# imports `FeatureProvider` / `OwnedCatalog` / `ProviderError`, which exist only
# from 0.1.1. Measured 2026-08-28 by building the packaged crate against the
# registry: with `version = "0.1.0"`, `cargo build --features api` fails with
# E0432 unresolved imports, because Cargo is free to pick published 0.1.0. In
# this workspace the path dep satisfies the requirement either way, so the bug
# is invisible locally and only fires for a downstream consumer.
zenanalyze-api = { version = "0.1.1", path = "zenanalyze-api", optional = true }
zenpixels = { version = ">=0.2.14, <0.4.0", default-features = false, features = ["imgref"] }
zenpixels-convert = { version = ">=0.2.14, <0.4.0", default-features = false }
archmage = { version = "0.9.27", features = ["macros", "avx512", "testable_dispatch"] }
magetypes = { version = "0.9.27", features = ["avx512"] }
# `garb` provides SIMD pixel-format conversions (`rgba_to_rgb`,
# `bgra_to_rgb`, etc.) via `archmage::incant!` — used by the
# `RowStream::StripAlpha8` fast path. Measured ~7× speedup over the
# in-tree scalar strip on a 2048-px row (0.13 µs vs 0.94 µs at 4 MP).
garb = { version = "0.2.8", default-features = false, features = ["experimental"] }
# `transfer` feature exposes scalar PQ / HLG / sRGB / BT.709 EOTFs used by
# the source-direct HDR / depth tier (`tier_depth`).
linear-srgb = { version = "0.6.12", features = ["transfer"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# Mitchell-sharp renditioning for the imazen-26 training-corpus build
# (render_imazen26_variants example). Example-only.
zenresize = "0.3.1"
# Interleaved/paired microbench harness for the linear-intermediate
# representation A/B (bench_linear_repr example). Example-only.
zenbench = "0.1.8"
# Decision-change measurement (budget_decision_ab example): drives the SHIPPED
# cross-codec routers through their real entry point (`zenpicker::default_route`)
# under two feature-extraction regimes, and replays the zenjpeg picker bake with
# `zenpredict`. Both are workspace members, so this adds nothing to the published
# dependency graph — dev-only, and neither is a dependency of the library.
zenpicker = { path = "zenpicker", features = ["api"] }
zenpredict = { path = "zenpredict" }

