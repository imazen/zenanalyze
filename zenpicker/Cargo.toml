[package]
name = "zenpicker"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
repository = "https://github.com/imazen/zenanalyze"
description = "Codec-family meta-picker. Given image features + a quality target + an allowed-family mask, picks one of {jpeg, webp, jxl, avif, png, gif}; per-codec pickers handle config selection within the chosen family. Loads a baked ZNPR v3 model via zenpredict."
keywords = ["mlp", "inference", "codec", "picker", "no-std"]
categories = ["multimedia::images", "no-std"]
authors = ["Lilith River <lilith@imazen.io>"]
rust-version = "1.93"
readme = "README.crates.md"

[lib]
name = "zenpicker"

[features]
default = ["std", "api"]
# Mirrors zenpredict's `std` gate. `no_std + alloc` builds drop the
# `std::error::Error` impls; everything else works.
std = ["zenpredict/std"]
# The `zenanalyze-api` feature contract — the routing surface is built on it
# exclusively: `MetaPicker::feature_request` / `content_capability` consume a
# shared `Offer`, the version-unifying way to feed features in. On by default
# (the routing API needs it); `no_std + alloc` compatible (zenanalyze-api is
# zero-dep). Opt out with `default-features = false` for a no_std/no-api build.
api = ["dep:zenanalyze-api"]

[dependencies]
zenpredict = { version = "0.2.0", path = "../zenpredict", default-features = false }
# The frozen, version-unifying feature contract. Optional (gated by `api`), 1.0
# and zero-dep so it unifies across a multi-version build.
zenanalyze-api = { version = "0.1.0", path = "../zenanalyze-api", optional = true }

[dev-dependencies]
# Bake tiny ZNPR models for the `feature_request` integration test (api feature).
zenpredict-bake = { path = "../zenpredict-bake" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
