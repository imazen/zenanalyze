name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Harden crate downloads against transient crates.io flakes. The
  # windows-11-arm runner intermittently hits `curl [16] Error in the HTTP2
  # framing layer` mid-download (e.g. arrow-row), failing the whole job.
  # Force HTTP/1.1 and retry hard.
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

# Superseded runs only waste runner queue — particularly the macOS
# jobs, which wait on GitHub's scarcest pool. Only the newest
# commit's run matters per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-11-arm, macos-15-intel, macos-latest]
        features: ["", "experimental", "hdr", "experimental,hdr"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.features == 'experimental,hdr' && matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Clippy
        if: matrix.features == 'experimental,hdr' && matrix.os == 'ubuntu-latest'
        run: cargo clippy --features "${{ matrix.features }}" --all-targets -- -D warnings
      - name: Build
        run: cargo build --no-default-features --features "${{ matrix.features }}"
      - name: Test
        # `golden_is_stable` needs the full (experimental,hdr) feature set the
        # golden was blessed with, so it's skipped in the generic per-feature-combo
        # run here and exercised by the dedicated xplat step below.
        run: cargo test --no-default-features --features "${{ matrix.features }}" --lib -- --skip golden_is_stable
      - name: Golden tolerance check (xplat — x86 blesses, every platform checks)
        # ONE platform (x86_64, the golden-reference job) defines the golden values;
        # EVERY platform re-extracts live and checks within the per-feature
        # tolerance, so cross-platform divergence is bounded, not just measured on
        # the reference. Structural-exempt features (covariances: a degeneracy guard
        # that flips 0.0-vs-nonzero per SIMD tier — unbridgeable) are enforced only
        # on the reference job and merely *reported* here. The printed per-platform
        # spread is how the tolerances are sized empirically. Only meaningful under
        # the full feature set the golden carries.
        if: matrix.features == 'experimental,hdr'
        run: cargo test --no-default-features --features "experimental,hdr" --lib versioning::tests::golden_is_stable -- --exact --nocapture
      # The `api` feature (the zenanalyze-api producer surface: OwnedOffer +
      # feature_set_provenance + the serialization-provenance sidecar) is not in
      # the matrix above, so cover it once on ubuntu — otherwise the api-gated
      # code (and the extract_features_for_picker example's stamping path) would
      # bit-rot un-CI'd. Includes zenanalyze-api itself.
      - name: Clippy + test (api feature)
        if: matrix.features == 'experimental,hdr' && matrix.os == 'ubuntu-latest'
        run: |
          cargo clippy --features "api,hdr" --all-targets -- -D warnings
          cargo test --features "api,hdr" --lib
          cargo test -p zenanalyze-api
      - name: Build zenpicker
        run: cargo build -p zenpicker
      - name: Test zenpicker
        run: cargo test -p zenpicker --lib
      - name: Test zenpicker (api consumer contract)
        # `tests/feature_request.rs` is `#![cfg(feature="api")]` and the `--lib`
        # step above excludes integration tests, so without this the consumer
        # half of the feature contract is never exercised in CI (the consumer is
        # exactly the half that silently rots). Run the gated integration tests
        # AND clippy the gated path under -D warnings.
        if: matrix.features == 'experimental,hdr' && matrix.os == 'ubuntu-latest'
        run: |
          cargo test -p zenpicker --features api --tests
          cargo clippy -p zenpicker --features api --all-targets -- -D warnings
      - name: Clippy zenpicker
        if: matrix.features == 'experimental,hdr' && matrix.os == 'ubuntu-latest'
        run: cargo clippy -p zenpicker --all-targets -- -D warnings
      - name: Build zenpicker examples
        if: matrix.features == 'experimental,hdr' && matrix.os == 'ubuntu-latest'
        run: cargo build -p zenpicker --examples

  zenpredict:
    name: zenpredict (${{ matrix.os }} / ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-11-arm, macos-15-intel, macos-latest]
        # zenpredict has 3 valid feature combos (`advanced` requires `std`):
        #   ""             — no_std + alloc, runtime only
        #   "std"          — full runtime (lean: predict + argmin_masked)
        #   "std,advanced" — full runtime + typed multi-output / safety /
        #                    rescue / top-K / scorer-hybrid API
        features: ["", "std", "std,advanced"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.features == 'std,advanced' && matrix.os == 'ubuntu-latest'
        run: cargo fmt -p zenpredict --check
      - name: Clippy
        if: matrix.features == 'std,advanced' && matrix.os == 'ubuntu-latest'
        run: cargo clippy -p zenpredict --no-default-features --features "${{ matrix.features }}" --all-targets -- -D warnings
      - name: Build
        run: cargo build -p zenpredict --no-default-features --features "${{ matrix.features }}"
      - name: Test (lib)
        run: cargo test -p zenpredict --no-default-features --features "${{ matrix.features }}" --lib
      - name: Test (integration)
        if: matrix.features == 'std,advanced'
        run: cargo test -p zenpredict --no-default-features --features "${{ matrix.features }}" --tests
      - name: Test (doc)
        if: matrix.features == 'std,advanced' && matrix.os == 'ubuntu-latest'
        run: cargo test -p zenpredict --no-default-features --features "${{ matrix.features }}" --doc

  zenpredict-bake:
    # The bake/composer tool. Not a runtime crate (runs at train/bake time on the
    # CI/dev box), so a single ubuntu job suffices — but it MUST be gated so the
    # `fit-yj` MLE bin + its golden-section test, the integration suites, and the
    # zenbench `predict` bench don't silently bit-rot (clippy --all-targets
    # compiles benches + examples too).
    name: zenpredict-bake (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt -p zenpredict-bake --check
      - name: Clippy (all features, all targets)
        run: cargo clippy -p zenpredict-bake --all-features --all-targets -- -D warnings
      - name: Build
        run: cargo build -p zenpredict-bake
      - name: Test (default)
        run: cargo test -p zenpredict-bake
      - name: Test (fit-yj — MLE bin + golden-section test)
        run: cargo test -p zenpredict-bake --features fit-yj

  cross:
    name: Cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cross build --target ${{ matrix.target }} --features "experimental,hdr"
      - name: Test
        env:
          # Surfaces inside the qemu guest so tests can detect emulated runtime
          # and apply looser timing thresholds. `cross` passes through
          # `CROSS_RUNTIME` automatically (passthrough is the default for
          # uppercase env vars set in the calling shell).
          CROSS_RUNTIME: "1"
        # Skip the reference-platform value tripwire on cross targets (i686 x87 /
        # aarch64 NEON diverge per SIMD tier) — see the Test job + golden-reference.
        # Also skip the log2 determinism assert: i686 has no hardware FMA, so
        # magetypes' mul_add takes the software fmaf fallback, which doesn't match
        # hardware-FMA platforms bit-for-bit (rsqrt_stable, being mul_add-free, stays
        # identical and is NOT skipped). The FMA-platform determinism is asserted by
        # the Test matrix + rsqrt-probe job. The perf test still runs.
        # golden_is_stable now runs here too (xplat tolerance check vs the x86
        # golden); only log2_…_determinism stays skipped on i686 (no hardware FMA).
        run: cross test --target ${{ matrix.target }} --features "experimental,hdr" --lib -- --skip log2_lowp_midp_determinism_and_accuracy
      # zenpredict — 32-bit and big-endian-adjacent coverage. Critical
      # because Model::from_bytes does u32 / usize arithmetic that wraps
      # on 32-bit; checked_mul guards exist but live-fire tests confirm.
      - name: Build zenpredict
        run: cross build -p zenpredict --target ${{ matrix.target }} --no-default-features --features "std,advanced"
      - name: Test zenpredict
        env:
          CROSS_RUNTIME: "1"
        run: cross test -p zenpredict --target ${{ matrix.target }} --no-default-features --features "std,advanced" --lib

  zentrain-pytests:
    # The zentrain Python tooling tests — pure-logic unit tests for the picker /
    # predict / metapicker libs and the feature serialization-provenance plumbing
    # (`_provenance.py`: the `zenanalyze-provenance/1` block carried through Parquet
    # metadata). Light deps (pytest + numpy + pyarrow), so a single ubuntu job keeps
    # them from bit-rotting. Run from `zentrain/tools` so the sibling modules import
    # by name.
    name: zentrain pytests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        # numpy: _predict/_metapicker libs; pyarrow: provenance Parquet metadata;
        # scikit-learn + joblib: _picker_lib's GBDT path (test_picker_lib_strict).
        run: python -m pip install --upgrade pytest numpy pyarrow scikit-learn joblib
      - name: Run zentrain tool tests
        working-directory: zentrain/tools
        # test_student_permutation_{relu,leakyrelu} assert np.array_equal (bit-exact
        # f32) between two different summation orders of the same math; that holds on
        # some numpy/BLAS builds but not others (CI differs by ~2^-18 f32 noise). They
        # are deselected here pending migration to np.allclose with an f32 tolerance —
        # the assertion is too strict cross-environment, not a logic failure.
        run: >
          python -m pytest -q test_provenance.py test_predict_lib.py
          test_picker_lib_strict.py test_metapicker_lib.py
          test_train_hybrid_knob_vetoes.py
          --deselect test_predict_lib.py::test_student_permutation_relu
          --deselect test_predict_lib.py::test_student_permutation_leakyrelu

  golden-reference:
    # The feature-versioning value tripwire's REFERENCE platform. `golden_is_stable`
    # re-extracts the synthetic corpus and bit-compares to the committed golden
    # (`src/versioning_golden.tsv`), within REL_TOLERANCE + the per-feature
    # overrides. Those budgets are sized from the x86_64 bless, so this is the one
    # job that asserts it — the portable Test/Cross jobs `--skip golden_is_stable`
    # because SIMD-reduced features diverge per tier (and a few cross a decision
    # threshold to 0.0-vs-nonzero, which no tolerance bridges). The version *hash*
    # is text-derived and platform-independent; only this live re-extraction check
    # is arch-pinned. Bless with ZENANALYZE_BLESS_GOLDEN=1 on x86_64.
    name: golden-reference (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Golden value-stability tripwire (the reference — enforces structural-exempt features too)
        # ZENANALYZE_GOLDEN_REFERENCE=1 marks this as the bless/reference platform,
        # so the structural-exempt features (covariances) ARE enforced here against
        # the golden they were blessed with — they're only exempted on the OTHER
        # (portable/cross) platforms where their guard flips 0.0-vs-nonzero.
        env:
          ZENANALYZE_GOLDEN_REFERENCE: "1"
        run: cargo test --features "experimental,hdr" versioning::tests::golden_is_stable -- --exact --nocapture

  rsqrt-probe:
    # Measures the cross-platform divergence of the four √ methods (exact /
    # hardware rsqrt_approx / magetypes Newton-refined rsqrt / our deterministic
    # rsqrt_stable). `--nocapture` surfaces the `RSQRTPROBE` hash lines so we can
    # read each method's per-arch hash from the logs: the hardware methods differ
    # per SIMD tier (x86 rsqrtps/vrsqrt14 vs ARM vrsqrte), while `stable` + `exact`
    # MUST be byte-identical everywhere (also asserted in-test against the blessed
    # hash). x86 + both ARM flavours cover the interesting spread.
    name: rsqrt-probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: rsqrt + log2 method probe
        run: cargo test --features hdr --lib simd_math -- --nocapture
